<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.mahh != null} ? 'Cập Nhật Sản Phẩm' : 'Thêm Sản Phẩm Mới'">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/product.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
            <i class="fas" th:classappend="${product.mahh != null} ? 'fa-edit' : 'fa-plus-circle'"></i>
            <span th:text="${product.mahh != null} ? 'Cập Nhật Sản Phẩm' : 'Thêm Sản Phẩm Mới'"></span>
        </h2>
        <a th:href="@{/admin(tab='products')}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>Quay lại danh sách
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-bold text-primary">Thông tin sản phẩm</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/save}"
                  th:object="${product}"
                  method="post"
                  enctype="multipart/form-data"
                  class="row g-3">

                <input type="hidden" th:field="*{mahh}">

                <div class="col-md-6">
                    <label for="tenhh" class="form-label fw-bold">Tên sản phẩm <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="tenhh" th:field="*{tenhh}" placeholder="Nhập tên sản phẩm..." required>
                </div>

                <div class="col-md-6">
                    <label for="maloai" class="form-label fw-bold">Loại sản phẩm <span class="text-danger">*</span></label>
                    <select class="form-select" id="maloai" th:field="*{maloai}" required>
                        <option value="">-- Chọn loại sản phẩm --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.maloai}"
                                th:text="${cat.tenloai}"></option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label for="giamgia" class="form-label fw-bold">Giảm giá </label>
                    <div class="input-group">
                        <input type="number" step="0.01" class="form-control" id="giamgia" th:field="*{giamgia}" min="0" max="1000000">
                        <span class="input-group-text">đ</span>
                    </div>
                </div>

                <div class="col-md-3">
                    <label for="soluotxem" class="form-label fw-bold">Lượt xem</label>
                    <input type="number" class="form-control" id="soluotxem" th:field="*{soluotxem}" min="0">
                </div>

                <div class="col-md-6">
                    <label for="ngaylap" class="form-label fw-bold">Ngày tạo</label>
                    <input type="date" class="form-control" id="ngaylap" name="ngaylap"
                           th:value="${product.ngaylap != null ? #temporals.format(product.ngaylap, 'yyyy-MM-dd') : #dates.format(#dates.createNow(), 'yyyy-MM-dd')}" required>
                </div>

                <div class="col-md-6">
                    <label for="dacbiet" class="form-label fw-bold">Đặc biệt</label>
                    <select class="form-select" id="dacbiet" th:field="*{dacbiet}">
                        <option value="0">Thường</option>
                        <option value="1">Nổi bật (Hot)</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="tinhtrang" class="form-label fw-bold">Trạng thái</label>
                    <select class="form-select" id="tinhtrang" th:field="*{tinhtrang}">
                        <option value="1">Hiển thị</option>
                        <option value="0">Đang ẩn</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="imageFile" class="form-label fw-bold">Hình ảnh đại diện</label>
                    <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*"
                           th:required="${product.mahh == 0 || product.mahh == null}">
                    <div class="form-text text-muted">Chấp nhận định dạng: .jpg, .png, .jpeg</div>

                    <div th:if="${product.hinh != null}" class="mt-3 p-2 border rounded d-inline-block bg-white">
                        <p class="mb-1 small fw-bold">Ảnh hiện tại:</p>
                        <img th:src="@{'/images/' + ${product.hinh}}" alt="Product Image" class="img-thumbnail" style="max-height: 150px;">
                    </div>
                </div>

                <div class="col-12">
                    <label for="mota" class="form-label fw-bold">Mô tả chi tiết</label>
                    <textarea class="form-control" id="mota" th:field="*{mota}" rows="5" placeholder="Nhập mô tả sản phẩm..."></textarea>
                </div>

                <div class="col-12 text-end mt-4 border-top pt-3">
                    <a th:href="@{/admin(tab='products')}" class="btn btn-secondary me-2">
                        <i class="fas fa-times me-1"></i> Hủy bỏ
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Lưu sản phẩm
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
