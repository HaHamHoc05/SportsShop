<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Giày Đá Banh Cao Cấp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/product.css}" />
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<section id="banner">
    <div id="bannerCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img  th:src="@{/images/banner1.jpg}" class="d-block w-100" alt="Banner 1">
            </div>
            <div class="carousel-item ">
                <img  th:src="@{/images/banner2.jpg}" class="d-block w-100" alt="Banner 2">
            </div>
            <div class="carousel-item">
                <img  th:src="@{/images/banner3.jpg}" class="d-block w-100" alt="Banner 3">
            </div>
            <div class="carousel-item">
                <img  th:src="@{/images/banner4.jpg}" class="d-block w-100" alt="Banner 4">
            </div>
            <div class="carousel-item">
                <img  th:src="@{/images/banner5.jpg}" class="d-block w-100" alt="Banner 5">
            </div>
        </div>
        <!-- Nút điều khiển -->
        <a class="carousel-control-prev" href="#bannerCarousel" role="button" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </a>
        <a class="carousel-control-next" href="#bannerCarousel" role="button" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </a>
    </div>
</section>
<!-- Sản phẩm khuyến mãi -->
<section class="container mt-5">
    <h2 class="text-center mb-4">SẢN PHẨM KHUYẾN MÃI</h2>
    <div class="row">
        <div class="col-md-3 mb-4" th:each="p : ${saleProducts}">
            <div class="card h-100">
                <img th:src="@{'/images/' + ${p.hinh}}" class="card-img-top" th:alt="${p.tenhh}" style="height: 250px; object-fit: cover;">
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${p.tenhh}">Tên sản phẩm</h5>
                    <p class="card-text price" th:text="${#numbers.formatDecimal(p.dongia,0, 'POINT', 0, 'COMMA')} + 'đ'">3.000.000₫</p>
                    <a th:href="@{'/product/' + ${p.mahh}}" class="btn btn-primary btn-sm">Xem Chi Tiết</a>
                </div>
            </div>
        </div>
    </div>
</section>
<section class="container mb-5">
    <h2 class="text-center mb-4">SẢN PHẨM NỔI BẬT</h2>
    <div class="row">
    <div class="col-6 col-md-3 mb-4" th:each="p : ${sanPhamNoiBat}">
        <div class="card product-card h-100">
            <img th:src="@{'/images/' + ${p.hinh}}" class="card-img-top" th:alt="${p.tenhh}" style="height: 250px; object-fit: cover;">
            <div class="card-body text-center">
                <h5 class="card-title" th:text="${p.tenhh}">Tên sản phẩm</h5>
                <p class="card-text price" th:text="${#numbers.formatDecimal(p.dongia,0, 'POINT', 0, 'COMMA')} + 'đ'">3.000.000₫</p>
                <a th:href="@{'/product/' + ${p.mahh}}" class="btn btn-primary btn-sm">Xem Chi Tiết</a>
            </div>
        </div>
    </div>
    </div>
    <div class="text-center mt-4">
        <a th:href="@{/products}" class="btn btn-outline-primary btn-lg">Xem Tất Cả Sản Phẩm <i class="fas fa-long-arrow-alt-right ms-2"></i></a>
    </div>
</section>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
