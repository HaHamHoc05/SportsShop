<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/product.css}" />

</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center mb-4">Đăng Nhập</h2>

                    <form th:action="@{/login}" method="post">
                        <input type="hidden" name="redirect" th:value="${param.redirect}">

                        <div id="loginError" th:if="${error}" class="alert alert-danger" role="alert">
                            Tên đăng nhập hoặc mật khẩu không đúng.
                        </div>

                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="name@example.com" required>
                            <label for="username">Email hoặc Tên đăng nhập</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            <label for="password">Mật khẩu</label>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Ghi nhớ tôi
                                </label>
                            </div>
                            <a href="#">Quên mật khẩu?</a>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Đăng Nhập</button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <p class="text-center">Chưa có tài khoản?
                        <a th:href="@{/register}">Đăng ký ngay</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script>
    // Chờ DOM load
    document.addEventListener("DOMContentLoaded", function() {
        const errorDiv = document.getElementById("loginError");
        if (errorDiv) {
            // Ẩn sau 3 giây (3000ms)
            setTimeout(() => {
                errorDiv.style.display = "none";
            }, 2000);
        }
    });
</script>
</body>
</html>
