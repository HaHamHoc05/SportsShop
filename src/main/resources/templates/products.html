<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/product.css}" />
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="container my-5">

    <div class="row">

        <!-- Bộ lọc -->
        <aside class="col-lg-3 mb-4">
            <div class="card">
                <div class="card-header">
                    <h5><i class="fas fa-filter me-2"></i> Bộ Lọc</h5>
                </div>
                <div class="card-body">
                    <h6 class="mb-3">Thương Hiệu</h6>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="brandNike">
                        <label class="form-check-label" for="brandNike">Nike</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="brandAdidas">
                        <label class="form-check-label" for="brandAdidas">Adidas</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="brandPuma">
                        <label class="form-check-label" for="brandPuma">Puma</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="brandMizuno">
                        <label class="form-check-label" for="brandMizuno">Mizuno</label>
                    </div>

                    <hr>

                    <h6 class="mb-3">Khoảng Giá</h6>
                    <div class="mb-3">
                        <label for="priceRange" class="form-label">Tối đa: <span id="priceValue">3.000.000</span>₫</label>
                        <input type="range" class="form-range" min="500000" max="5000000" step="100000" id="priceRange" value="3000000">
                    </div>

                    <button class="btn btn-primary w-100">Áp Dụng</button>
                </div>
            </div>
        </aside>

        <!-- Danh sách sản phẩm -->
        <section class="col-lg-9">
            <h2 class="mb-4 text-center">
                <span th:if="${searchKeyword != null}" th:text="'Kết quả tìm kiếm cho: ' + ${searchKeyword}"></span>
                <span th:if="${searchKeyword == null}">Tất cả sản phẩm</span>
            </h2>

            <div th:if="${products.size() == 0}" class="alert alert-warning text-center">
                Không tìm thấy sản phẩm nào.
            </div>

            <div class="row">
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4 d-flex align-items-stretch" th:each="product : ${products}">
                    <a th:href="@{'/product/' + ${product.mahh}}" class="text-decoration-none w-100">
                        <div class="card w-100 shadow-sm border-0 h-100 d-flex flex-column">
                            <img th:src="@{'/images/' + ${product.hinh}}" th:alt="${product.tenhh}" class="card-img-top product-img" style="height:250px; object-fit:cover;">
                            <div class="card-body d-flex flex-column justify-content-between text-center">
                                <h5 class="card-title mb-2" th:text="${product.tenhh}">Tên sản phẩm</h5>
                                <p class="mb-0" th:text="${#numbers.formatDecimal(product.dongia, 0, 'POINT', 0, 'COMMA')} + 'đ'"></p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Phân trang -->
            <nav aria-label="Page navigation" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0}? 'disabled'">
                        <a class="page-link" th:href="@{/products(page=${currentPage - 1})}">Trang trước</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link">Trang <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span></span>
                    </li>
                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages}? 'disabled'">
                        <a class="page-link" th:href="@{/products(page=${currentPage + 1})}">Trang sau</a>
                    </li>
                </ul>
            </nav>
        </section>

    </div>
</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const priceRange = document.getElementById('priceRange');
    const priceValue = document.getElementById('priceValue');
    priceRange.addEventListener('input', function() {
        priceValue.textContent = new Intl.NumberFormat('vi-VN').format(this.value);
    });
</script>
</body>
</html>
