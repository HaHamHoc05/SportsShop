<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" >
<style>
    /* Đã dọn dẹp CSS để tránh xung đột.
      'navbar-dark' sẽ tự động làm logo màu trắng.
    */
    .navbar-brand {
        font-weight: bold;
    }

    /* Tạo khoảng cách cho nhóm menu ở giữa */
    .navbar-nav.nav-center {
        display: flex;
        gap: 1.5rem;
        align-items: center;
    }

    /* Tạo khoảng cách cho nhóm hành động bên phải */
    .navbar-nav.nav-right {
        display: flex;
        /* Luôn giữ hàng ngang (quan trọng khi thu nhỏ) */
        flex-direction: row;
        align-items: center;
        gap: 1rem; /* Khoảng cách nhỏ hơn cho các icon/hành động */
    }

    /* Đảm bảo form tìm kiếm không bị vỡ trên màn hình vừa */
    @media (min-width: 992px) and (max-width: 1200px) {
        .nav-center .form-control {
            width: 120px; /* Thu nhỏ ô tìm kiếm một chút */
        }
    }
</style>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" th:fragment="siteHeader">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">Giày Bóng Đá</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav mx-auto nav-center">
                <li class="nav-item"><a class="nav-link active" th:href="@{/}">Trang Chủ</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">Sản Phẩm</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Tin Tức</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Liên Hệ</a></li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownBrands" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">Thương Hiệu</a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdownBrands">
                        <li><a class="dropdown-item" th:href="@{/products/brand/adidas}">Adidas</a></li>
                        <li><a class="dropdown-item" th:href="@{/products/brand/nike}">Nike</a></li>
                        <li><a class="dropdown-item" th:href="@{/products/brand/puma}">Puma</a></li>
                        <li><a class="dropdown-item" th:href="@{/products/brand/mizuno}">Mizuno</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownFields" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">Sản Phẩm</a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdownFields">
                        <li><a class="dropdown-item" th:href="@{/products/field/natural}">Sân cỏ tự nhiên</a></li>
                        <li><a class="dropdown-item" th:href="@{/products/field/artificial}">Sân cỏ nhân tạo</a></li>
                        <li><a class="dropdown-item" th:href="@{/products/field/futsal}">Sân futsal</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <form class="d-flex" th:action="@{/search}" method="get">
                        <input class="form-control me-2" type="text" name="q" placeholder="Tìm kiếm">
                        <button class="btn btn-outline-success" type="submit">Tìm</button>
                    </form>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto nav-right">
                <li class="nav-item position-relative">
                    <a class="nav-link position-relative" th:href="@{/cart}"><i class="fas fa-shopping-cart"></i> Giỏ Hàng</a>
                    <span class="badge bg-danger position-absolute top-0 start-100 translate-middle" th:text="${cartCount}">0</span>
                </li>

                <li class="nav-item" th:if="${session.username == null}">
                    <a class="nav-link" th:href="@{/register}">Đăng Ký</a>
                </li>
                <li class="nav-item" th:if="${session.username == null}">
                    <a class="nav-link" th:href="@{/login}">Đăng Nhập</a>
                </li>

                <li class="nav-item" th:if="${session.username != null}">
                    <a class="nav-link" href="#">Xin chào, <span th:text="${session.username}">User</span></a>
                </li>
                <li class="nav-item" th:if="${session.username != null}">
                    <a class="nav-link" th:href="@{/logout}">Đăng xuất</a>
                </li>
            </ul>

        </div>
    </div>
</nav>
</html>
